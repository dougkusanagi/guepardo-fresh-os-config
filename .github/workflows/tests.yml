name: Installer tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_smoke:
        type: boolean
        default: false
        description: Install a small CLI sample on disposable Windows/Ubuntu runners
  workflow_call:
permissions:
  contents: read
jobs:
  scoop-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.real_smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Default installer prepares Scoop and aria2 automatically
        shell: pwsh
        run: ./install.ps1 -Apps chmln.sd,dbrgn.tealdeer -NoPrefetch -NoColor
      - name: Verify default provider and downloader
        shell: pwsh
        run: |
          $state = Get-Content "$env:LOCALAPPDATA/Guepardo/State/install-state.json" -Raw | ConvertFrom-Json
          foreach ($id in @('chmln.sd','dbrgn.tealdeer')) {
            if ($state.packages.$id.provider -ne 'scoop') { throw "Scoop was not used for $id" }
          }
          & "$env:USERPROFILE/scoop/shims/scoop.ps1" prefix aria2
          if ($LASTEXITCODE -ne 0) { throw 'aria2 is not installed' }
      - name: Default recovery reuses Scoop
        shell: pwsh
        run: ./install.ps1 -Resume -NoPrefetch -NoColor
  windows-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.real_smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - shell: pwsh
        run: ./install.ps1 -Apps junegunn.fzf,sharkdp.bat,BurntSushi.ripgrep.MSVC,Clement.bottom,dbrgn.tealdeer -Provider winget -NoPrefetch -NoColor
      - shell: pwsh
        run: ./install.ps1 -Apps junegunn.fzf,sharkdp.bat,BurntSushi.ripgrep.MSVC,Clement.bottom,dbrgn.tealdeer -Provider winget -NoPrefetch -NoColor -Resume
  linux-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.real_smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/smoke-linux.sh
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: ./test.sh --mode=static --distro=ubuntu
      - run: ./test.sh --mode=static --distro=fedora
      - run: bash tests/rust-toolchain.sh
      - run: go test -race ./...
      - run: go vet ./...
      - run: ./scripts/build-release.sh
      - run: cd dist && sha256sum -c SHA256SUMS
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - shell: pwsh
        run: ./tests/test-windows.ps1
      - shell: pwsh
        run: ./tests/windows-reliability.ps1

      - shell: pwsh
        run: ./tests/apps-windows.ps1
      - shell: pwsh
        run: ./tests/installer-engine.tests.ps1
      - shell: powershell
        run: ./tests/installer-engine.tests.ps1
      - shell: pwsh
        run: ./tests/keyboard-picker.tests.ps1
      - shell: powershell
        run: ./tests/keyboard-picker.tests.ps1
      - shell: pwsh
        run: ./tests/download-http.tests.ps1
      - shell: pwsh
        run: ./tests/installer-integration.tests.ps1
      - shell: pwsh
        run: ./tests/jellyfin-suite.ps1
      - shell: powershell
        run: ./tests/jellyfin-suite.ps1
